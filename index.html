<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#eef4fb">
<title>Catatan Jastip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef4fb;--card:#fff;--ink:#1f3a5c;--mute:#5f7896;--line:#d6e3f2;--acc:#2f6fd1;--hi:#d93a4e;--ok:#1a8a5a;--soft:#dfeafa;--sun:#7fb0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a2b;--card:#15263d;--ink:#e6eefa;--mute:#8da6c4;--line:#243b5a;--soft:#1b3150}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%;touch-action:pan-x pan-y;scroll-padding-top:env(safe-area-inset-top,0px)}
body{touch-action:pan-x pan-y;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:11px 14px 5px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 1px 0 transparent}
h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:16px;font-weight:800;margin:20px 0 8px}
.sub{color:var(--mute);font-size:11px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 14px;background:var(--soft);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
main{padding:0 14px;max-width:560px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.orders-list{padding-bottom:8px}.order-group{margin:8px 0 12px}.order-group-title{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:7px 4px;font-size:13px;font-weight:800;color:var(--ink);border-bottom:1px solid var(--line)}.order-card{padding:5px 7px;margin:4px 0;border-radius:10px}.order-card .thumb{width:40px;height:40px}.order-card .price{font-size:14px}.order-card .steps{gap:3px;margin-top:5px}.order-card .steps button{min-height:27px;padding:0 5px;font-size:9px;border-radius:8px}.order-card .acts{gap:4px;margin-top:5px}.order-card .acts button,.order-card .acts .wa{min-height:31px;padding:0 9px;font-size:11px}
.order-card .row{gap:7px}
.order-card .who{font-size:13px}
.order-card .item{font-size:14px;line-height:1.25}
.order-card .fx{font-size:11px;line-height:1.3}
.order-card .price{font-size:14px}
.order-card .thumb{width:40px;height:40px;border-radius:7px}
.order-card .steps{gap:2px;margin:4px 0 4px}
.order-card .steps button{min-height:25px;font-size:9px;border-radius:7px}
.order-card .acts{gap:5px}
.order-card .acts button,.order-card .acts .wa{min-height:30px;padding:0 8px;border-radius:8px;font-size:11px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{font-weight:800}.item{font-size:16px;font-weight:600}
.price{font-weight:800;font-size:17px;text-align:right}
.fx{font-size:12px;color:var(--mute)}
.steps{display:flex;gap:4px;margin:10px 0 8px}
.steps button{flex:1;min-height:30px;padding:0;border-radius:8px;font-size:10px;white-space:nowrap;overflow:hidden;background:var(--line);color:var(--mute)}
.steps button.done{background:var(--soft);color:var(--ink)}
.steps button.cur{background:var(--ink);color:var(--bg)}
.acts{display:flex;gap:8px}
.go{flex:1;background:var(--acc);color:#fff;font-weight:800}
.wa{background:#25d366;color:#053b1c;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;text-decoration:none}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;font-weight:600}
.lunas{background:#d6f3e3;color:#0d6a42}.utang{background:#ffe3e7;color:#b3182f}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
.nav button{flex:1;background:none;min-height:48px;padding:0 4px;font-size:14px}
.nav button.on{background:var(--soft);font-weight:800}
.fab{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px) + 10px);width:44px;height:44px;min-height:44px;padding:0;background:var(--acc);color:#fff;font-weight:800;font-size:22px;line-height:44px;text-align:center;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:19}
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;margin:10px 0}
.hero b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .card{margin:0}.grid b{display:block;font-size:17px}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}.sheet-close{position:absolute;right:10px;top:8px;width:36px;min-width:36px;height:36px;min-height:36px;padding:0;border-radius:99px;background:var(--soft);font-size:22px;line-height:1;font-weight:800;z-index:2}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:8px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{background:var(--soft);border-radius:12px;padding:10px 12px;margin:12px 0;font-weight:600}
.primary{width:100%;background:var(--acc);color:#fff;font-weight:800;min-height:50px;margin-top:6px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:9;max-width:536px;margin:auto}
.warn{background:#fff3c4;color:#5b4700;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}.savehint{font-size:11px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
/* Layout tab Pesanan
   Header aplikasi + toolbar tetap, hanya daftar order yang scroll.
   Dibuat dengan flex pada BODY agar tidak menghasilkan area daftar setinggi 0px. */
body.orders-lock{
  height:100dvh;
  min-height:100dvh;
  overflow:hidden;
  padding-bottom:0;
  display:flex;
  flex-direction:column;
}
body.orders-lock header{
  flex:0 0 auto;
  position:relative;
  top:auto;
}
body.orders-lock main{
  flex:1 1 auto;
  height:auto;
  min-height:0;
  width:100%;
  overflow:hidden;
}
body.orders-lock #m{
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.orders-page{
  flex:1 1 auto;
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.orders-toolbar{
  flex:0 0 auto;
  background:var(--bg);
  padding-bottom:4px;
  z-index:4;
}
.orders-scroll{
  flex:1 1 auto;
  height:auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 1px 90px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  touch-action:pan-y;
}
.orders-scroll .order-group-title{position:sticky;top:0}
.orders-scroll > .order-group{flex:0 0 auto}
.orders-scroll::-webkit-scrollbar{width:7px}
.orders-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.orders-toolbar .search-group-row{display:grid;grid-template-columns:minmax(0,1fr) 118px 118px;gap:6px;align-items:center;margin:4px 0 5px}
.orders-toolbar .search-group-row input{margin:0!important;min-width:0}
.orders-toolbar .search-group-row select{width:100%!important;min-width:0!important;margin:0;min-height:38px;height:38px;padding:5px 7px;font-size:11px}
.orders-toolbar .sort-row{display:none}
.orders-toolbar .sort-row label{display:none}
.orders-toolbar .sort-row select{display:none}


/* Toolbar Pesanan lebih ringkas di HP agar daftar order mendapat ruang lebih besar */
@media (max-width: 600px){
  body.orders-lock .orders-toolbar{padding-bottom:2px}
  body.orders-lock .orders-toolbar > *{margin-bottom:5px}
  body.orders-lock .orders-toolbar select,
  body.orders-lock .orders-toolbar input{min-height:38px;height:38px;padding:5px 10px;font-size:14px;border-radius:10px}
  body.orders-lock .orders-toolbar .chips{gap:5px;margin:4px 0}
  body.orders-lock .orders-toolbar .chips button{min-height:34px;height:34px;padding:0 10px;font-size:12px;border-radius:18px}
  body.orders-lock .orders-toolbar .two{gap:6px}
  body.orders-lock .orders-toolbar label{font-size:11px;margin:4px 0 2px}
  body.orders-lock .orders-toolbar .muted,
  body.orders-lock .orders-toolbar small{font-size:10px}
  body.orders-lock .orders-toolbar .group-row{gap:6px}
  body.orders-lock .orders-toolbar .search-group-row{grid-template-columns:minmax(0,1fr) 108px 108px;gap:5px;margin:3px 0 4px}
  body.orders-lock .orders-toolbar .search-group-row select{width:100%!important;font-size:10px}
  body.orders-lock .orders-toolbar .sort-row{margin:0 0 4px}
  body.orders-lock .orders-toolbar .sort-row select{width:132px;font-size:10px}
  body.orders-lock .orders-scroll{padding-bottom:120px}
}

/* Rekap trip ringkas */
.trip-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 13px;margin:8px 0}
.trip-hero .trip-profit{font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.trip-hero .trip-caption{font-size:11px;opacity:.72;margin-bottom:3px}
.trip-hero .trip-meta{font-size:11px;opacity:.78;text-align:right}
.trip-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:7px 0 10px}
.trip-stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px;min-width:0}
.trip-stat .ico{font-size:14px;line-height:1;margin-bottom:4px}
.trip-stat .lbl{font-size:9px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-stat b{display:block;font-size:12px;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px}
.trip-section-title h2{margin:0;font-size:14px}
.trip-section-title .fx{font-size:10px}
.trip-customer{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin:5px 0}
.trip-customer .avatar{width:24px;height:24px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink)}
.trip-customer .name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-customer .detail{font-size:9px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.trip-customer .profit{text-align:right;font-size:12px;font-weight:800;white-space:nowrap}
.trip-customer .profit small{display:block;font-size:9px;color:var(--mute);font-weight:600}
.trip-mini-bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.trip-mini-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.trip-recap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:11px;line-height:1.45}
.trip-recap-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.trip-recap-row:last-child{border-bottom:0}
.trip-recap-row b{font-size:11px;text-align:right}
.trip-history .card{padding:9px 10px;margin:6px 0;border-radius:11px}
@media(max-width:430px){.trip-stat-grid{grid-template-columns:repeat(2,1fr)}.trip-hero .trip-profit{font-size:19px}}
.customer-toolbar{position:sticky;top:56px;z-index:18;background:var(--bg);padding:4px 0 8px}.customer-toolbar .primary{margin-top:0}.customer-search{margin-top:7px}.customer-count{font-size:11px;color:var(--mute);padding:5px 2px 0}

body.tab-p .card,body.tab-c .card{padding:8px 10px;margin:6px 0;border-radius:12px}
body.tab-p .hero{padding:10px 12px;margin:6px 0;border-radius:13px}
body.tab-p .hero b{font-size:20px}
body.tab-p .chips{padding:5px 0}
body.tab-p .chip{min-height:32px;padding:0 10px;font-size:12px}
body.tab-p .item{font-size:14px}
body.tab-p .fx,body.tab-c .fx{font-size:10px}
body.tab-p .thumb{width:38px;height:38px}
body.tab-p .card .row{gap:7px}
body.tab-c .customer-toolbar{padding-bottom:5px}
body.tab-c .customer-toolbar .primary{min-height:38px;font-size:13px}
body.tab-c .customer-search{min-height:38px;height:38px;font-size:13px}
body.tab-c .card .acts{margin-top:6px!important}
body.tab-c .card button,body.tab-c .card .wa{min-height:34px;font-size:12px}

.found{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;cursor:zoom-in;border:1px solid var(--line)}
.big{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--soft);margin-top:6px}
pre{white-space:pre-wrap;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

<header><div><h1 id="tn"></h1><div class="sub" id="ts"></div><div class="fx" id="cs">☁ Menghubungkan…</div></div><button id="gear" aria-label="Atur trip">Atur</button></header>

<script>
const CUR={IDR:['Rp',1],JPY:['¥',110],KRW:['₩',11.6],SGD:['S$',12900],THB:['฿',490],HKD:['HK$',2100],USD:['$',16400],MYR:['RM',3900],TWD:['NT$',520],EUR:['€',19200],AUD:['A$',10900],CNY:['CN¥',2300]};
const ST=['Dicari','Ketemu','Dibeli','Dibayar','OTW Indo','Done'];
const CAT=['Skincare','Makeup','Obat & Vitamin','Snack & Makanan','Fashion','Lainnya'];
const firebaseConfig={
  apiKey:"AIzaSyBX3GOOzJz5e32-VhK_RdXfRzSTnXqBjyk",
  authDomain:"aplikasi-admin-jastip.firebaseapp.com",
  projectId:"aplikasi-admin-jastip",
  storageBucket:"aplikasi-admin-jastip.firebasestorage.app",
  messagingSenderId:"652391383919",
  appId:"1:652391383919:web:1e91cd54623cab61cc9e9a"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth(), storage=firebase.storage();
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}

const K='jastip-v2';
const CLIENT_ID=(localStorage.getItem(K+'-client')||('c-'+Math.random().toString(36).slice(2,10))).toString();
localStorage.setItem(K+'-client',CLIENT_ID);
const def=()=>({trip:{name:'Trip baru',markup:15,cur:'JPY'},rates:Object.fromEntries(Object.entries(CUR).map(([k,v])=>[k,v[1]])),ratesAt:null,customers:[],orders:[],history:[],tab:'q',filter:-1,ships:{},pk:'siap',pick:[],pdfPrice:true,q:'',cq:'',orderGroup:'date',orderSort:'newest',kp:[],trips:[],tripId:'',view:'cur'});
let S=def();
let localPending=false;
let localEditAt=Number(localStorage.getItem(K+'-edit-at')||0);
let cloudMetaCache=null;
function loadCache(){
  try{
    const x=JSON.parse(localStorage.getItem(K)||'null');
    if(x)S=Object.assign(def(),x);
    localPending=localStorage.getItem(K+'-pending')==='1';
  }catch(e){}
}
loadCache();
let cloudReady=false,cloudBooted=false,cloudWriting=false,cloudTimer=null,cloudDirty=false,cloudState='connecting',cloudStarted=false;
let initialCloud={customers:false,orders:false,trips:false,ships:false,meta:false};
const cloudShadow={customers:{},orders:{},trips:{},ships:{},meta:''};
const localBase={customers:{},orders:{},trips:{},ships:{},meta:''};
let serverSnapshotReady=false;

function stable(x){return JSON.stringify(x,(k,v)=>v&&v.toDate?v.toDate().toISOString():v)}
function metaPlain(){
  return {
    trip:S.trip,rates:S.rates,ratesAt:S.ratesAt,history:S.history,tab:S.tab,
    filter:S.filter,pk:S.pk,pick:S.pick,pdfPrice:S.pdfPrice,q:S.q,kp:S.kp,
    tripId:S.tripId,view:S.view,v2:S.v2||1,orderGroup:S.orderGroup||'date',orderSort:S.orderSort||'newest'
  };
}
function metaData(ts){return {...metaPlain(),updatedAtMs:ts,clientId:CLIENT_ID}}
function logicalMeta(x){
  if(!x)return null;
  return {
    trip:x.trip,rates:x.rates,ratesAt:x.ratesAt,history:x.history,tab:x.tab,
    filter:x.filter,pk:x.pk,pick:x.pick,pdfPrice:x.pdfPrice,q:x.q,kp:x.kp,
    tripId:x.tripId,view:x.view,v2:x.v2||1,orderGroup:x.orderGroup||'date',orderSort:x.orderSort||'newest'
  };
}
function cloudLogicalSig(col,id){
  try{
    const x=JSON.parse(cloudShadow[col][id]||'null');
    if(!x)return null;
    return stable(x._deleted?{_deleted:true}:stripCloud(x));
  }catch(e){return null}
}
function businessSig(x){return stable(stripCloud(x||{}))}
function cloudMetaLogicalSig(){
  try{
    const x=JSON.parse(cloudShadow.meta||'null');
    return stable(logicalMeta(x));
  }catch(e){return null}
}
function setCloudState(state){cloudState=state;const el=$('#cs');if(el)el.textContent=state==='online'?'☁ Tersimpan & sinkron':state==='saving'?'☁ Menyimpan…':state==='error'?'☁ Belum tersimpan':'☁ Menghubungkan…'}
function cacheSave(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'-pending',localPending?'1':'0');localStorage.setItem(K+'-pending-ts',String(Date.now()));localStorage.setItem(K+'-edit-at',String(localEditAt||0))}catch(e){toast('Penyimpanan HP gagal. Browser ini mungkin memblokir localStorage.',7000)}}
function cacheBaseSave(){try{localStorage.setItem(K+'-base',JSON.stringify(localBase))}catch(e){}}
function cacheBaseLoad(){try{return JSON.parse(localStorage.getItem(K+'-base')||'null')}catch(e){return null}}
function cloudOrder(x){const y={...(x||{})};delete y._updatedAtMs;delete y._clientId;return y}
function liveDocs(){const docs={customers:{},orders:{},trips:{},ships:{}};S.customers.forEach(x=>docs.customers[x.id]=cloudOrder(x));S.orders.forEach(x=>docs.orders[x.id]=cloudOrder(x));S.trips.forEach(x=>docs.trips[x.id]=cloudOrder(x));Object.entries(S.ships||{}).forEach(([id,x])=>docs.ships[id]=cloudOrder(x));return docs}
function markLocalChanges(now){const docs=liveDocs();for(const col of Object.keys(docs)){for(const [id,data] of Object.entries(docs[col])){const before=localBase[col][id];if(!before||stable(before)!==stable(data))data._updatedAtMs=now;else if(before._updatedAtMs!=null)data._updatedAtMs=before._updatedAtMs;data._clientId=CLIENT_ID}}return docs}
function buildOps(){

}

function shrink(f){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;r.onload=()=>{
    const i=new Image();i.onerror=rej;i.onload=()=>{
      const maxSide=480,k=Math.min(1,maxSide/Math.max(i.width,i.height));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));
      const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(i,0,0,c.width,c.height);
      // Maksimum 480px + JPEG quality 0.55 agar ukuran foto jauh lebih kecil.
      res(c.toDataURL('image/jpeg',.55));
    };i.src=r.result;
  };r.readAsDataURL(f);
})}

async function deleteTrip(id){
const t=S.trips.find(x=>x.id===id);
if(!t)return;
if(!t.closedAt){toast('Trip aktif tidak bisa dihapus. Tutup trip dulu agar aman.',3500);return}
const os=S.orders.filter(o=>o.tripId===id);
const resis=[...new Set(os.map(o=>o.resi).filter(Boolean))];
if(!confirm(`Hapus trip "${t.name}" beserta ${os.length} pesanan di dalamnya? Data ini tidak bisa dikembalikan kecuali dari file cadangan.`))return;

toast('Menghapus trip…',5000);

// Hapus foto lama dari Firebase Storage bila ada. Kegagalan Storage tidak
// menghentikan penghapusan data Firestore agar trip tetap bisa dibersihkan.
let photoFail=0;
for(const o of os){
  if(o.photoPath){
    try{await deletePhoto(o.photoPath)}catch(err){photoFail++;console.warn('Gagal menghapus foto',o.id,err)}
  }
}

// Hapus trip dan seluruh pesanan trip dari data lokal.
// Customer sengaja tidak dihapus karena bisa dipakai trip lain.
S.orders=S.orders.filter(o=>o.tripId!==id);
S.trips=S.trips.filter(x=>x.id!==id);

// Resi yang tidak lagi dipakai oleh pesanan mana pun ikut dibersihkan.
for(const r of resis){
  if(!S.orders.some(o=>o.resi===r))delete S.ships[r];
}

// Pastikan selalu ada trip aktif.
if(!S.trips.length){
  const nid=uid();
  S.trips=[{id:nid,name:'Trip baru',ts:Date.now()}];
  S.tripId=nid;
  S.trip={name:'Trip baru',markup:15,cur:'JPY',mt:'pct'};
}else if(!S.trips.some(x=>x.id===S.tripId)){
  const active=S.trips.find(x=>!x.closedAt)||S.trips[S.trips.length-1];
  S.tripId=active.id;
  S.trip={...S.trip,name:active.name};
}
S.view='cur';S.filter=-1;S.tab='d';
save();render();

toast(photoFail?`Trip dihapus. ${photoFail} foto gagal ikut dihapus dari Storage.`:'Trip dan semua pesanannya berhasil dihapus ✔',4500);
}

<label>Markup standar</label><div class="two"><select id="t-mt"><option value="pct" ${S.trip.mt!=='idr'?'selected':''}>Persen (%)</option><option value="idr" ${S.trip.mt==='idr'?'selected':''}>Nominal (Rp per pcs)</option></select><input id="t-m" inputmode="decimal" value="${S.trip.markup}" aria-label="Besar markup standar"></div><button class="primary" id="t-ok">Simpan</button>`);
$('#t-ok').onclick=()=>{S.trip.name=$('#t-n').value.trim()||'Trip baru';{const ct=S.trips.find(x=>x.id===S.tripId);if(ct)ct.name=S.trip.name}S.trip.markup=num($('#t-m').value);S.trip.mt=$('#t-mt').value;save();close();render()}}

document.addEventListener('click',ev=>{const z=ev.target.closest('[data-z]');if(z){const o=S.orders.find(x=>x.id===z.dataset.z);if(o)sheet(`<div class="who">${e(o.item)}</div><img class="big" style="max-height:70vh" src="${o.photo}" alt="Foto ${e(o.item)}"><button class="primary" id="zc">Tutup</button>`);return}
const t=ev.target.closest('button');if(!t)return;const d=t.dataset;
if(t.id==='zc')return close();
if(d.t){rememberTabScroll(S.tab);S.tab=d.t;save();render()}else if(d.f){rememberTabScroll();S.filter=+d.f;render()}
else if(d.s){const[i,n]=d.s.split(':');reqStatus(i,+n)}else if(d.pay)paySheet(d.pay);else if(d.pk){S.pk=d.pk;save();render()}else if(d.shipdone){S.ships[d.shipdone].st=3;save();render()}else if(d.tv){S.view=d.tv;S.filter=-1;S.tab='q';save();render()}else if(d.dtrip){deleteTrip(d.dtrip)}
else if(d.kpall){const td=S.orders.filter(o=>bought(o)&&(o.pm||'kargo')==='koper'&&!o.resi&&!o.packed).map(o=>o.id);S.kp=S.kp.length===td.length?[]:td;render()}else if(d.kpok){S.orders.forEach(o=>{if(S.kp.includes(o.id))o.packed=true});S.kp=[];save();render()}else if(d.kpundo){S.orders.find(x=>x.id===d.kpundo).packed=false;save();render()}else if(d.ship!==undefined)shipSheet(d.ship||null);else if(d.pdf)savePdf(d.pdf);else if(d.imp){if(!t.dataset.cf){t.dataset.cf=1;t.textContent='Ini menimpa data sekarang. Ketuk lagi untuk pilih file';return}$('#imp').click()}else if(d.eo)orderSheet(d.eo);else if(d.ec!==undefined)custSheet(d.ec);
else if(t.id==='fab')orderSheet();else if(t.id==='gear')tripSheet();
else if(t.id==='bak')backup()
else if(t.id==='newtrip'){if(!t.dataset.cf){t.dataset.cf=1;t.textContent='Yakin cutoff? Pesanan lama tetap tersimpan. Ketuk lagi';return}
const ct=S.trips.find(x=>x.id===S.tripId);ct.name=S.trip.name;ct.closedAt=Date.now();const nid=uid();S.trips.push({id:nid,name:'Trip baru',ts:Date.now()});S.tripId=nid;S.trip.name='Trip baru';S.view='cur';S.filter=-1;S.tab='q';save();render()}
else if(t.id==='live')live(t)});
document.addEventListener('input',ev=>{const c=ev.target.dataset.r;if(c){S.rates[c]=num(ev.target.value);S.ratesAt=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});save()}});
async function live(b){b.textContent='Lagi ambil kurs…';try{const ac=new AbortController();setTimeout(()=>ac.abort(),7000);
const j=await (await fetch('https://open.er-api.com/v6/latest/IDR',{signal:ac.signal})).json();
Object.keys(S.rates).forEach(c=>{if(j.rates&&j.rates[c])S.rates[c]=Math.round(1/j.rates[c]*100)/100});
S.ratesAt=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})+' (otomatis)';save();render();toast('Kurs terbaru masuk ✔',3000)}
catch(er){b.textContent='Coba ambil kurs terbaru';toast('Kurs otomatis belum bisa diambil di sini. Isi manual ya.',4500)}}
render();
</script></body></html>
